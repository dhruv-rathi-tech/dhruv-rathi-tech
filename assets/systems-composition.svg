<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="auto" role="img" aria-label="Dhruv Rathi - Systems Synthesis Architectural Illustration">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Inter", sans-serif; }
      .serif { font-family: ui-serif, Georgia, "Times New Roman", Cambria, serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    </style>

    <!-- Subtle Dot Grid for Editorial Paper Feel -->
    <pattern id="dotPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#25272F" />
    </pattern>

    <!-- Data Coordinate Field Pattern -->
    <pattern id="dataPoints" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1" fill="#D4A373" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Editorial Plate Canvas -->
  <rect width="900" height="380" rx="6" fill="#111215" stroke="#23252B" stroke-width="1.2" />
  <rect width="900" height="380" rx="6" fill="url(#dotPattern)" opacity="0.6" />

  <!-- Top Caption Strip -->
  <text x="44" y="32" class="mono" font-size="9" fill="#7E7A72" letter-spacing="2">SYSTEMS MAP // STOCHASTIC INTELLIGENCE BOUND TO DETERMINISTIC RUNTIMES</text>
  <text x="856" y="32" text-anchor="end" class="mono" font-size="9" fill="#C85A32" letter-spacing="1.5">FIG. 01</text>
  <line x1="44" y1="44" x2="856" y2="44" stroke="#1E2026" stroke-width="1" />

  <!-- Background Coordinate Axes & Architectural Guides -->
  <line x1="44" y1="195" x2="856" y2="195" stroke="#1E2128" stroke-width="1" />
  <line x1="140" y1="60" x2="140" y2="330" stroke="#1B1C22" stroke-width="0.8" stroke-dasharray="2,3" />
  <line x1="300" y1="60" x2="300" y2="330" stroke="#1B1C22" stroke-width="0.8" stroke-dasharray="2,3" />
  <line x1="480" y1="60" x2="480" y2="330" stroke="#1B1C22" stroke-width="0.8" stroke-dasharray="2,3" />
  <line x1="660" y1="60" x2="660" y2="330" stroke="#1B1C22" stroke-width="0.8" stroke-dasharray="2,3" />
  <line x1="800" y1="60" x2="800" y2="330" stroke="#1B1C22" stroke-width="0.8" stroke-dasharray="2,3" />

  <!-- 1. DATA: Raw Corpus, Telemetry, and Distribution Rings -->
  <g transform="translate(130, 195)">
    <!-- Concentric coordinate rings -->
    <circle cx="0" cy="0" r="90" fill="none" stroke="#D4A373" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.3" />
    <circle cx="0" cy="0" r="60" fill="none" stroke="#D4A373" stroke-width="0.9" opacity="0.5" />
    <circle cx="0" cy="0" r="30" fill="#D4A373" fill-opacity="0.08" stroke="#D4A373" stroke-width="1.2" />
    <!-- Data points & crosshairs -->
    <path d="M -15 0 H 15 M 0 -15 V 15" stroke="#D4A373" stroke-width="1" />
    <circle cx="-20" cy="-18" r="2.5" fill="#D4A373" />
    <circle cx="22" cy="15" r="2" fill="#D4A373" />
    <circle cx="42" cy="-28" r="1.8" fill="#D4A373" opacity="0.7" />
    <circle cx="-38" cy="32" r="1.8" fill="#D4A373" opacity="0.7" />
    <text x="0" y="112" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#D4A373" letter-spacing="1.5">01 / DATA</text>
    <text x="0" y="126" text-anchor="middle" class="sans" font-size="9" fill="#8C877D">Telemetry &amp; SQL Schemas</text>
  </g>

  <!-- 2. RETRIEVAL: Vector Projections & Manifold Waveforms -->
  <g transform="translate(310, 195)">
    <!-- Hyperbolic vector rays -->
    <path d="M -70 50 C -30 20, 20 -40, 70 -60" fill="none" stroke="#7E8B76" stroke-width="1.4" />
    <path d="M -70 20 C -20 0, 30 -20, 70 -30" fill="none" stroke="#7E8B76" stroke-width="1" stroke-dasharray="3,3" />
    <path d="M -70 -20 C -20 0, 20 20, 70 40" fill="none" stroke="#7E8B76" stroke-width="1.2" />
    <!-- Focal ellipse / Reranking focal zone -->
    <ellipse cx="0" cy="0" rx="42" ry="75" fill="none" stroke="#7E8B76" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.6" />
    <ellipse cx="0" cy="0" rx="22" ry="40" fill="#7E8B76" fill-opacity="0.08" stroke="#7E8B76" stroke-width="1" />
    <!-- Projection nodes -->
    <circle cx="-32" cy="10" r="2.5" fill="#7E8B76" />
    <circle cx="0" cy="0" r="3" fill="#7E8B76" />
    <circle cx="36" cy="-14" r="2.5" fill="#7E8B76" />
    <text x="0" y="112" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#7E8B76" letter-spacing="1.5">02 / RETRIEVAL</text>
    <text x="0" y="126" text-anchor="middle" class="sans" font-size="9" fill="#8C877D">Dense / Sparse Manifolds</text>
  </g>

  <!-- Intersecting Flow Envelope: Data & Retrieval -> Model -->
  <path d="M 190 170 C 240 140, 400 130, 480 150" fill="none" stroke="#3A3B45" stroke-width="1" stroke-dasharray="2,3" />
  <path d="M 190 220 C 260 250, 400 250, 480 230" fill="none" stroke="#3A3B45" stroke-width="1" stroke-dasharray="2,3" />

  <!-- 3. MODEL: Latent Probability Manifold (Terracotta Core) -->
  <g transform="translate(490, 195)">
    <!-- Latent Probability Gaussian & Ellipses -->
    <ellipse cx="0" cy="0" rx="80" ry="80" fill="none" stroke="#C85A32" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.4" />
    <ellipse cx="0" cy="0" rx="55" ry="55" fill="#C85A32" fill-opacity="0.08" stroke="#C85A32" stroke-width="1.2" />
    <!-- Continuous probability wave curve -->
    <path d="M -65 15 C -40 -40, -15 -60, 0 -60 C 15 -60, 40 -10, 65 20" fill="none" stroke="#C85A32" stroke-width="2" />
    <path d="M -55 25 C -30 -15, -10 -35, 0 -35 C 10 -35, 30 5, 55 35" fill="none" stroke="#C85A32" stroke-width="1" opacity="0.6" />
    <circle cx="0" cy="-60" r="3.5" fill="#C85A32" />
    <circle cx="0" cy="0" r="4" fill="#FAF7F2" stroke="#C85A32" stroke-width="1.5" />
    <text x="0" y="112" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#C85A32" letter-spacing="1.5">03 / MODEL</text>
    <text x="0" y="126" text-anchor="middle" class="sans" font-size="9" fill="#8C877D">Stochastic Inference</text>
  </g>

  <!-- 4. LOGIC: Verification Invariants & Schema Locks -->
  <g transform="translate(660, 195)">
    <!-- Orthogonal Invariant Frame Intersecting the Field -->
    <rect x="-45" y="-55" width="90" height="110" rx="2" fill="none" stroke="#9A968E" stroke-width="1.2" stroke-dasharray="4,3" />
    <rect x="-30" y="-40" width="60" height="80" rx="2" fill="#9A968E" fill-opacity="0.08" stroke="#9A968E" stroke-width="1.2" />
    <!-- Gate crossbars and calibration tick marks -->
    <line x1="-45" y1="0" x2="45" y2="0" stroke="#9A968E" stroke-width="1" />
    <line x1="0" y1="-55" x2="0" y2="55" stroke="#9A968E" stroke-width="1" />
    <circle cx="0" cy="0" r="3" fill="#9A968E" />
    <text x="0" y="112" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#9A968E" letter-spacing="1.5">04 / LOGIC</text>
    <text x="0" y="126" text-anchor="middle" class="sans" font-size="9" fill="#8C877D">Invariant Locks &amp; Verification</text>
  </g>

  <!-- 5. SOFTWARE: Deterministic Runtime Lattice -->
  <g transform="translate(800, 195)">
    <!-- Concentric production lattice -->
    <rect x="-35" y="-50" width="70" height="100" rx="4" fill="#18191E" stroke="#FAF7F2" stroke-width="1.2" />
    <rect x="-24" y="-36" width="48" height="72" rx="2" fill="none" stroke="#FAF7F2" stroke-width="0.8" opacity="0.6" />
    <line x1="-35" y1="-20" x2="35" y2="-20" stroke="#2B2D35" stroke-width="1" />
    <line x1="-35" y1="10" x2="35" y2="10" stroke="#2B2D35" stroke-width="1" />
    <!-- Status nodes -->
    <circle cx="0" cy="-5" r="3.5" fill="#C85A32" />
    <circle cx="-14" cy="-5" r="2" fill="#FAF7F2" />
    <circle cx="14" cy="-5" r="2" fill="#FAF7F2" />
    <text x="0" y="112" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#FAF7F2" letter-spacing="1.5">05 / SOFTWARE</text>
    <text x="0" y="126" text-anchor="middle" class="sans" font-size="9" fill="#8C877D">Observable Systems</text>
  </g>

  <!-- Harmonic Continuity Arc across all 5 systems -->
  <path d="M 60 195 C 200 90, 490 80, 850 195" fill="none" stroke="#C85A32" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.45" />

  <!-- Bottom Legend Rule -->
  <line x1="44" y1="344" x2="856" y2="344" stroke="#1E2026" stroke-width="1" />

  <!-- Editorial Legend Strip -->
  <circle cx="50" cy="358" r="3" fill="#D4A373" />
  <text x="60" y="361" class="mono" font-size="8.5" fill="#8C877D">DATA // TELEMETRY</text>

  <circle cx="210" cy="358" r="3" fill="#7E8B76" />
  <text x="220" y="361" class="mono" font-size="8.5" fill="#8C877D">RETRIEVAL // EMBEDDINGS</text>

  <circle cx="390" cy="358" r="3" fill="#C85A32" />
  <text x="400" y="361" class="mono" font-size="8.5" fill="#C85A32">MODEL // INFERENCE</text>

  <circle cx="560" cy="358" r="3" fill="#9A968E" />
  <text x="570" y="361" class="mono" font-size="8.5" fill="#8C877D">LOGIC // INVARIANTS</text>

  <circle cx="730" cy="358" r="3" fill="#FAF7F2" />
  <text x="740" y="361" class="mono" font-size="8.5" fill="#FAF7F2">SOFTWARE // RUNTIME</text>
</svg>
