<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="auto" role="img" aria-label="Dhruv Rathi - Technical Field Notes &amp; System Specimen">
  <defs>
    <!-- Dark Ink Parchment Gradient -->
    <linearGradient id="sootBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141518" />
      <stop offset="50%" stop-color="#111214" />
      <stop offset="100%" stop-color="#141518" />
    </linearGradient>

    <!-- Warm Burnt Terracotta Highlight Gradient -->
    <linearGradient id="terraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C85A32" />
      <stop offset="100%" stop-color="#E07A4F" />
    </linearGradient>

    <!-- Subtle Technical Drafting Grid -->
    <pattern id="draftGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#23242A" stroke-width="0.5" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .serif { font-family: ui-serif, Georgia, "Times New Roman", Cambria, serif; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <!-- Outer Specimen Plate Container -->
  <rect width="920" height="280" rx="8" fill="url(#sootBg)" stroke="#2B2C33" stroke-width="1.2" />
  <rect width="920" height="280" rx="8" fill="url(#draftGrid)" />

  <!-- Technical Registration Crosshairs at Corners -->
  <path d="M 18 24 H 30 M 24 18 V 30" stroke="#484954" stroke-width="0.8" />
  <path d="M 890 24 H 902 M 896 18 V 30" stroke="#484954" stroke-width="0.8" />
  <path d="M 18 256 H 30 M 24 250 V 262" stroke="#484954" stroke-width="0.8" />
  <path d="M 890 256 H 902 M 896 250 V 262" stroke="#484954" stroke-width="0.8" />

  <!-- TOP HEADER STRIP -->
  <text x="44" y="39" class="mono" font-size="10" font-weight="600" fill="#9E9A91" letter-spacing="1.5">PLATE 01 // TECHNICAL DOSSIER &amp; SYSTEM APPARATUS</text>
  
  <!-- Disposition / Availability Pill -->
  <g transform="translate(620, 24)">
    <rect width="256" height="24" rx="3" fill="#201614" stroke="#B84A28" stroke-width="0.9" />
    <circle cx="14" cy="12" r="3.5" fill="#D9532F" />
    <text x="26" y="15.5" class="mono" font-size="9.5" font-weight="700" fill="#E88260" letter-spacing="1">OPEN TO AI/ML • DATA • SDE</text>
  </g>

  <!-- Top Divider Rule -->
  <line x1="44" y1="56" x2="876" y2="56" stroke="#25262D" stroke-width="1" />

  <!-- MIDDLE SECTION: IDENTITY & SYSTEM ARCHITECTURE -->
  <!-- Left Side: Identity & Thesis -->
  <text x="44" y="86" class="mono" font-size="9.5" font-weight="700" fill="#C85A32" letter-spacing="1.8">SUBJECT IDENTIFICATION</text>
  <text x="44" y="122" class="sans" font-size="33" font-weight="900" fill="#FAF8F5" letter-spacing="0.5">DHRUV RATHI</text>
  <text x="44" y="146" class="mono" font-size="11.5" font-weight="600" fill="#C5C0B6" letter-spacing="2.5">AI / ML  ·  DATA  ·  SOFTWARE</text>
  <text x="44" y="174" class="serif" font-style="italic" font-size="14.5" fill="#D4CEBF">“Turning models into systems. Systems into products.”</text>
  <text x="44" y="204" class="mono" font-size="9.5" fill="#78756D" letter-spacing="0.8">VIT CHENNAI · ELECTRONICS &amp; COMPUTER ENG · CLASS OF 2027</text>

  <!-- Vertical Divider Hairline -->
  <line x1="400" y1="72" x2="400" y2="216" stroke="#25262D" stroke-width="1" stroke-dasharray="2,3" />

  <!-- Right Side: The 4-Chamber Architecture Apparatus -->
  <text x="424" y="86" class="mono" font-size="9.5" font-weight="700" fill="#9E9A91" letter-spacing="1.5">METHOD APPARATUS: RETRIEVE → REASON → VERIFY → SHIP</text>

  <!-- Station 01: RETRIEVE -->
  <g transform="translate(424, 100)">
    <rect width="98" height="84" rx="3" fill="#18191E" stroke="#32333B" stroke-width="0.9" />
    <text x="10" y="18" class="mono" font-size="8.5" font-weight="700" fill="#C85A32">01 / RETRIEVE</text>
    <text x="10" y="34" class="sans" font-size="11.5" font-weight="700" fill="#F0EDE6">CONTEXT</text>
    <text x="10" y="52" class="mono" font-size="8" fill="#8E8A80">Dense Vectors</text>
    <text x="10" y="65" class="mono" font-size="8" fill="#8E8A80">BM25 / SQL</text>
    <text x="10" y="76" class="mono" font-size="7.5" fill="#68655E">Telemetry</text>
  </g>

  <!-- Flow Connector 1 -> 2 -->
  <line x1="522" y1="142" x2="542" y2="142" stroke="#484954" stroke-width="1" stroke-dasharray="2,2" />
  <polygon points="541,139 546,142 541,145" fill="#C85A32" />

  <!-- Station 02: REASON -->
  <g transform="translate(546, 100)">
    <rect width="98" height="84" rx="3" fill="#18191E" stroke="#32333B" stroke-width="0.9" />
    <text x="10" y="18" class="mono" font-size="8.5" font-weight="700" fill="#C85A32">02 / REASON</text>
    <text x="10" y="34" class="sans" font-size="11.5" font-weight="700" fill="#F0EDE6">INFERENCE</text>
    <text x="10" y="52" class="mono" font-size="8" fill="#8E8A80">PyTorch / TF</text>
    <text x="10" y="65" class="mono" font-size="8" fill="#8E8A80">LLMs &amp; RAG</text>
    <text x="10" y="76" class="mono" font-size="7.5" fill="#68655E">Tool Agents</text>
  </g>

  <!-- Flow Connector 2 -> 3 -->
  <line x1="644" y1="142" x2="664" y2="142" stroke="#484954" stroke-width="1" stroke-dasharray="2,2" />
  <polygon points="663,139 668,142 663,145" fill="#C85A32" />

  <!-- Station 03: VERIFY -->
  <g transform="translate(668, 100)">
    <rect width="98" height="84" rx="3" fill="#18191E" stroke="#32333B" stroke-width="0.9" />
    <text x="10" y="18" class="mono" font-size="8.5" font-weight="700" fill="#C85A32">03 / VERIFY</text>
    <text x="10" y="34" class="sans" font-size="11.5" font-weight="700" fill="#F0EDE6">GROUNDING</text>
    <text x="10" y="52" class="mono" font-size="8" fill="#8E8A80">Reranking</text>
    <text x="10" y="65" class="mono" font-size="8" fill="#8E8A80">Schema Locks</text>
    <text x="10" y="76" class="mono" font-size="7.5" fill="#68655E">Guardrails</text>
  </g>

  <!-- Flow Connector 3 -> 4 -->
  <line x1="766" y1="142" x2="786" y2="142" stroke="#484954" stroke-width="1" stroke-dasharray="2,2" />
  <polygon points="785,139 790,142 785,145" fill="#C85A32" />

  <!-- Station 04: SHIP -->
  <g transform="translate(790, 100)">
    <rect width="86" height="84" rx="3" fill="#1C1816" stroke="#684132" stroke-width="1" />
    <text x="10" y="18" class="mono" font-size="8.5" font-weight="700" fill="#E88260">04 / SHIP</text>
    <text x="10" y="34" class="sans" font-size="11.5" font-weight="700" fill="#FAF8F5">PRODUCT</text>
    <text x="10" y="52" class="mono" font-size="8" fill="#C5C0B6">FastAPI / Node</text>
    <text x="10" y="65" class="mono" font-size="8" fill="#C5C0B6">Web &amp; APIs</text>
    <text x="10" y="76" class="mono" font-size="7.5" fill="#A8A398">Deployed</text>
  </g>

  <!-- Sub-Axis Annotation Strip -->
  <g transform="translate(424, 196)">
    <rect width="452" height="22" rx="2" fill="#18191E" stroke="#25262D" stroke-width="0.8" />
    <text x="12" y="14.5" class="mono" font-size="8.2" fill="#78756D">AXIS: GROUNDED DATA  ➔  MODEL INFERENCE  ➔  VERIFICATION  ➔  PRODUCTION SYSTEM</text>
  </g>

  <!-- Bottom Divider Rule -->
  <line x1="44" y1="234" x2="876" y2="234" stroke="#25262D" stroke-width="1" />

  <!-- BOTTOM METADATA -->
  <text x="44" y="258" class="mono" font-size="9" fill="#706D65" letter-spacing="1">FIELD NOTES // PROBABILISTIC MODELS BOUND TO DETERMINISTIC ARCHITECTURES</text>
  <text x="876" y="258" text-anchor="end" class="mono" font-size="9" fill="#C85A32" font-weight="700" letter-spacing="1">DHRUV-RATHI-TECH · ARCHIVE 2027</text>
</svg>
