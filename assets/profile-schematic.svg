<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="100%" height="auto" role="img" aria-label="Dhruv Rathi - AI/ML and Software Systems">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F1420" />
      <stop offset="100%" stop-color="#0A0D14" />
    </linearGradient>

    <!-- Sleek Top Edge Highlight Gradient -->
    <linearGradient id="topGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Center Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.08" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Inter", sans-serif;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
  </style>

  <!-- Container Box with Rounded Corners and Crisp Border -->
  <rect width="880" height="190" rx="10" fill="url(#bg)" stroke="#1E293B" stroke-width="1.2" />
  <rect width="880" height="190" rx="10" fill="url(#centerGlow)" />

  <!-- Elegant Top Accent Line -->
  <line x1="160" y1="1" x2="720" y2="1" stroke="url(#topGlow)" stroke-width="1.5" />

  <!-- Availability / Status Pill -->
  <g transform="translate(345, 26)">
    <rect width="190" height="22" rx="11" fill="#0C1B14" stroke="#164E38" stroke-width="0.8" />
    <circle cx="14" cy="11" r="3" fill="#10B981" />
    <circle cx="14" cy="11" r="5" fill="#10B981" opacity="0.25">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2s" repeatCount="indefinite" />
      <animate attributeName="r" values="4;6.5;4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="14.5" class="mono" font-size="9" font-weight="600" fill="#34D399" letter-spacing="1.2">OPEN TO AI/ML · SDE</text>
  </g>

  <!-- Subject Name -->
  <text x="440" y="88" text-anchor="middle" class="sans" font-size="34" font-weight="800" fill="#F8FAFC" letter-spacing="3.5">DHRUV RATHI</text>

  <!-- Primary Disciplines -->
  <text x="440" y="117" text-anchor="middle" class="mono" font-size="11" font-weight="500" fill="#94A3B8" letter-spacing="2.2">AI / ML &nbsp;·&nbsp; DATA SYSTEMS &nbsp;·&nbsp; SOFTWARE</text>

  <!-- Core Thesis / Tagline -->
  <text x="440" y="148" text-anchor="middle" class="sans" font-size="13" font-style="italic" fill="#64748B" letter-spacing="0.4">“Turning models into systems. Systems into products.”</text>
</svg>
