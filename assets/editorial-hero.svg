<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="auto" role="img" aria-label="Dhruv Rathi - Editorial Engineering Profile &amp; Systems Synthesis">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Inter", sans-serif; }
      .serif { font-family: ui-serif, Georgia, "Times New Roman", Cambria, serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- Editorial Plate Canvas -->
  <rect width="920" height="280" rx="6" fill="#111215" stroke="#23252B" stroke-width="1.2" />

  <!-- Top Masthead Bar -->
  <text x="44" y="30" class="mono" font-size="9.5" fill="#7E7A72" letter-spacing="2">EDITORIAL PROFILE // VOL. 2027</text>
  <text x="876" y="30" text-anchor="end" class="mono" font-size="9.5" fill="#7E7A72" letter-spacing="1">SYSTEMS SYNTHESIS MATRIX</text>
  <line x1="44" y1="42" x2="876" y2="42" stroke="#1E2026" stroke-width="1" />

  <!-- LEFT COLUMN: IDENTITY & POSITIONING -->
  <text x="44" y="90" class="sans" font-size="38" font-weight="850" fill="#FAF7F2" letter-spacing="0.5">DHRUV RATHI</text>
  <text x="46" y="116" class="mono" font-size="10.5" font-weight="600" fill="#C85A32" letter-spacing="2.5">AI / ML  ·  DATA SYSTEMS  ·  SOFTWARE</text>
  <text x="46" y="150" class="serif" font-style="italic" font-size="15.5" fill="#D6CFBF">&#8220;Turning models into systems. Systems into products.&#8221;</text>
  <text x="46" y="178" class="sans" font-size="11" fill="#7E7A72">Electronics &amp; Computer Engineering · VIT Chennai · Class of 2027</text>

  <!-- Availability Pill -->
  <rect x="46" y="204" width="224" height="32" rx="4" fill="#17181D" stroke="#2B2D35" stroke-width="1" />
  <circle cx="62" cy="220" r="3.5" fill="#C85A32" />
  <text x="74" y="223.5" class="mono" font-size="9" font-weight="700" fill="#C85A32" letter-spacing="1.2">OPEN TO ROLES : AI/ML · SDE</text>

  <!-- COLUMN DIVIDER RULE -->
  <line x1="436" y1="56" x2="436" y2="252" stroke="#1E2026" stroke-width="1" stroke-dasharray="2,3" />

  <!-- RIGHT COLUMN: THE 5 OBJECT LAYERS (FLOWCHART) -->
  <!-- Layer 1: AI / ML -->
  <g transform="translate(456, 56)">
    <text x="0" y="14" class="sans" font-size="12" font-weight="800" fill="#FAF7F2" letter-spacing="0.5">AI &amp; MACHINE LEARNING</text>
    <text x="0" y="28" class="mono" font-size="8.5" fill="#7E7A72">learn  &#183;  predict  &#183;  classify  &#183;  infer</text>
  </g>

  <!-- Layer 2: GENERATIVE AI -->
  <g transform="translate(456, 96)">
    <text x="0" y="14" class="sans" font-size="12" font-weight="800" fill="#FAF7F2" letter-spacing="0.5">GENERATIVE AI &amp; RETRIEVAL</text>
    <text x="0" y="28" class="mono" font-size="8.5" fill="#7E7A72">retrieve  &#183;  ground  &#183;  rerank  &#183;  embed</text>
  </g>

  <!-- Layer 3: AGENTIC SYSTEMS -->
  <g transform="translate(456, 136)">
    <text x="0" y="14" class="sans" font-size="12" font-weight="800" fill="#FAF7F2" letter-spacing="0.5">AGENTIC WORKFLOWS</text>
    <text x="0" y="28" class="mono" font-size="8.5" fill="#7E7A72">orchestrate  &#183;  reason  &#183;  verify  &#183;  loop</text>
  </g>

  <!-- Layer 4: DATA PLATFORMS -->
  <g transform="translate(456, 176)">
    <text x="0" y="14" class="sans" font-size="12" font-weight="800" fill="#FAF7F2" letter-spacing="0.5">DATA SYSTEMS</text>
    <text x="0" y="28" class="mono" font-size="8.5" fill="#7E7A72">ingest  &#183;  forecast  &#183;  detect  &#183;  model</text>
  </g>

  <!-- Layer 5: SOFTWARE SYSTEMS -->
  <g transform="translate(456, 216)">
    <text x="0" y="14" class="sans" font-size="12" font-weight="800" fill="#FAF7F2" letter-spacing="0.5">SOFTWARE ENGINEERING</text>
    <text x="0" y="28" class="mono" font-size="8.5" fill="#7E7A72">architect  &#183;  harden  &#183;  deploy  &#183;  ship</text>
  </g>

  <!-- CONVERGENCE VECTORS -->
  <path d="M 680 70 C 715 70, 728 150, 746 150" fill="none" stroke="#2B2D35" stroke-width="1" stroke-dasharray="2,2" />
  <path d="M 680 110 C 705 110, 728 150, 746 150" fill="none" stroke="#3A3B45" stroke-width="1" />
  <path d="M 680 150 L 746 150" fill="none" stroke="#C85A32" stroke-width="1.5" />
  <path d="M 680 190 C 705 190, 728 150, 746 150" fill="none" stroke="#3A3B45" stroke-width="1" />
  <path d="M 680 230 C 715 230, 728 150, 746 150" fill="none" stroke="#2B2D35" stroke-width="1" stroke-dasharray="2,2" />

  <!-- Convergence Node -->
  <circle cx="746" cy="150" r="3.5" fill="#C85A32" />

  <!-- SYNTHESIS CALLOUT BOX -->
  <rect x="760" y="118" width="106" height="64" rx="4" fill="#17181D" stroke="#2B2D35" stroke-width="1" />
  <circle cx="774" cy="134" r="2.5" fill="#C85A32" />
  <text x="783" y="137" class="mono" font-size="8" font-weight="700" fill="#C85A32" letter-spacing="1.2">SYNTHESIS</text>
  <text x="774" y="156" class="sans" font-size="12" font-weight="800" fill="#FAF7F2">PRODUCTION</text>
  <text x="774" y="170" class="sans" font-size="11" font-weight="600" fill="#9A968E">SYSTEMS</text>

  <!-- Bottom Hairline Rule -->
  <line x1="44" y1="264" x2="876" y2="264" stroke="#1E2026" stroke-width="1" />
</svg>
