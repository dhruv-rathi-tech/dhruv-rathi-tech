<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="100%" height="auto" role="img" aria-label="Dhruv Rathi - Systems Architecture &amp; Disciplines">
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Inter", sans-serif; }
      .serif { font-family: ui-serif, Georgia, "Times New Roman", Cambria, serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <!-- Editorial Plate Canvas -->
  <rect width="900" height="310" rx="6" fill="#111215" stroke="#23252B" stroke-width="1.2" />

  <!-- Top Caption Bar -->
  <text x="44" y="30" class="mono" font-size="9" fill="#7E7A72" letter-spacing="2">SYSTEMS ARCHITECTURE // CORE DISCIPLINES &amp; METHOD</text>
  <text x="856" y="30" text-anchor="end" class="mono" font-size="9" fill="#7E7A72" letter-spacing="1">SYNTHESIS MATRIX</text>
  <line x1="44" y1="42" x2="856" y2="42" stroke="#1E2026" stroke-width="1" />

  <!-- LEFT COLUMN: POSITIONING MANIFESTO -->
  <text x="44" y="74" class="mono" font-size="8.5" font-weight="700" fill="#C85A32" letter-spacing="1.5">THESIS &amp; IDENTITY</text>
  
  <text x="44" y="104" class="sans" font-size="20" font-weight="800" fill="#FAF7F2">Bridging stochastic models</text>
  <text x="44" y="128" class="sans" font-size="20" font-weight="800" fill="#FAF7F2">with deterministic runtimes.</text>
  
  <text x="44" y="164" class="sans" font-size="12" fill="#9A968E">I build at the interface where probabilistic inference,</text>
  <text x="44" y="182" class="sans" font-size="12" fill="#9A968E">dense vector retrieval, and unstructured data must</text>
  <text x="44" y="200" class="sans" font-size="12" fill="#9A968E">be bound by deterministic software guarantees.</text>
  
  <text x="44" y="242" class="mono" font-size="9" fill="#7E7A72" letter-spacing="1">FINAL-YEAR ECE · VIT CHENNAI · CLASS OF 2027</text>
  <text x="44" y="262" class="serif" font-style="italic" font-size="12.5" fill="#D6CFBF">&#8220;Turning models into systems. Systems into products.&#8221;</text>

  <!-- COLUMN DIVIDER RULE -->
  <line x1="396" y1="56" x2="396" y2="284" stroke="#1E2026" stroke-width="1" stroke-dasharray="2,3" />

  <!-- RIGHT COLUMN: THE 5 OBJECT LAYERS -->
  <!-- Layer 1: AI / ML -->
  <g transform="translate(420, 64)">
    <text x="0" y="14" class="sans" font-size="13" font-weight="800" fill="#FAF7F2" letter-spacing="0.5">AI &amp; MACHINE LEARNING</text>
    <text x="0" y="29" class="mono" font-size="9" fill="#7E7A72" letter-spacing="0.4">learn  &#183;  predict  &#183;  classify  &#183;  infer</text>
  </g>

  <!-- Layer 2: GENERATIVE AI -->
  <g transform="translate(420, 108)">
    <text x="0" y="14" class="sans" font-size="13" font-weight="800" fill="#FAF7F2" letter-spacing="0.5">GENERATIVE AI &amp; RETRIEVAL</text>
    <text x="0" y="29" class="mono" font-size="9" fill="#7E7A72" letter-spacing="0.4">retrieve  &#183;  ground  &#183;  rerank  &#183;  embed</text>
  </g>

  <!-- Layer 3: AGENTIC SYSTEMS -->
  <g transform="translate(420, 152)">
    <text x="0" y="14" class="sans" font-size="13" font-weight="800" fill="#FAF7F2" letter-spacing="0.5">AGENTIC WORKFLOWS</text>
    <text x="0" y="29" class="mono" font-size="9" fill="#7E7A72" letter-spacing="0.4">orchestrate  &#183;  reason  &#183;  verify  &#183;  loop</text>
  </g>

  <!-- Layer 4: DATA PLATFORMS -->
  <g transform="translate(420, 196)">
    <text x="0" y="14" class="sans" font-size="13" font-weight="800" fill="#FAF7F2" letter-spacing="0.5">DATA SYSTEMS</text>
    <text x="0" y="29" class="mono" font-size="9" fill="#7E7A72" letter-spacing="0.4">ingest  &#183;  forecast  &#183;  detect  &#183;  model</text>
  </g>

  <!-- Layer 5: SOFTWARE SYSTEMS -->
  <g transform="translate(420, 240)">
    <text x="0" y="14" class="sans" font-size="13" font-weight="800" fill="#FAF7F2" letter-spacing="0.5">SOFTWARE ENGINEERING</text>
    <text x="0" y="29" class="mono" font-size="9" fill="#7E7A72" letter-spacing="0.4">architect  &#183;  harden  &#183;  deploy  &#183;  ship</text>
  </g>

  <!-- CONVERGENCE VECTORS -->
  <path d="M 660 78 C 700 78, 715 166, 736 166" fill="none" stroke="#2B2D35" stroke-width="1" stroke-dasharray="2,2" />
  <path d="M 660 122 C 690 122, 715 166, 736 166" fill="none" stroke="#3A3B45" stroke-width="1" />
  <path d="M 660 166 L 736 166" fill="none" stroke="#C85A32" stroke-width="1.5" />
  <path d="M 660 210 C 690 210, 715 166, 736 166" fill="none" stroke="#3A3B45" stroke-width="1" />
  <path d="M 660 254 C 700 254, 715 166, 736 166" fill="none" stroke="#2B2D35" stroke-width="1" stroke-dasharray="2,2" />

  <!-- Convergence Node -->
  <circle cx="736" cy="166" r="3.5" fill="#C85A32" />

  <!-- SYNTHESIS CALLOUT BOX -->
  <rect x="750" y="134" width="106" height="64" rx="4" fill="#17181D" stroke="#2B2D35" stroke-width="1" />
  <circle cx="765" cy="150" r="2.5" fill="#C85A32" />
  <text x="774" y="153" class="mono" font-size="8" font-weight="700" fill="#C85A32" letter-spacing="1.2">SYNTHESIS</text>
  <text x="765" y="172" class="sans" font-size="12" font-weight="800" fill="#FAF7F2">PRODUCTION</text>
  <text x="765" y="186" class="sans" font-size="11" font-weight="600" fill="#9A968E">SYSTEMS</text>

  <!-- Bottom Hairline Rule -->
  <line x1="44" y1="294" x2="856" y2="294" stroke="#1E2026" stroke-width="1" />
</svg>
